---
layout: default
---

<article class="post">
  <header class="post-header">
    <p class="post-kind">{{ page.categories | first }}</p>
    <h1>{{ page.title }}</h1>
    <p class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
      {% if page.paper %}
        <span>{{ page.paper }}</span>
      {% endif %}
    </p>
  </header>

  <div class="prose">
    {{ content }}
  </div>
</article>
