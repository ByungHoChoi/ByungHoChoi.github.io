title: "BH Choi"
description: "Paper reviews, daily notes, and learning logs."
url: "https://byunghochoi.github.io"
baseurl: ""
repository: "ByungHoChoi/ByungHoChoi.github.io"

author:
  name: "Byung Ho Choi"
  bio: "AI computer system and system software engineer. I write about papers, systems, learning, and ordinary days."
  location: "Seoul, Korea"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/ByungHoChoi"

theme: minimal-mistakes-jekyll
minimal_mistakes_skin: "air"
locale: "en-US"
search: true
breadcrumbs: true

permalink: /:categories/:year/:month/:day/:title/

plugins:
  - jekyll-include-cache

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "single"
      author_profile: true
      read_time: true
      comments: false
      share: false
      related: true

markdown: kramdown
highlighter: rouge

exclude:
  - examples/
  - vendor/
